tags:
  - Auth
summary: log in to your account
operationId: loginUser
description: >
  user logs in and gets an access token to use for protected routes
  the refresh token is saved in a cookie
  use the access token in the authorization header for all other requests
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/user.yaml#/LoginInput'
responses:
  '200':
    description: login worked got the access token back
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
  '400':
    $ref: '../../../components/responses/errors.yaml#/400'
  '401':
    description: wrong email or password
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Unauthorized'
