tags:
  - Auth
summary: reset the password using the token from email
operationId: resetPassword
description: >
  checks the token from the email and updates the users password
  after this all sessions get deleted so the user has to log in again
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            description: the token you got in the reset email
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          password:
            type: string
            minLength: 6
            maxLength: 20
            description: the new password you want to use
            example: 'newSecurePassword123'
responses:
  '200':
    description: password was changed
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
            data:
              type: object
              example: {}
  '400':
    $ref: '../../../components/responses/errors.yaml#/400'
  '401':
    description: the token is wrong or already expired
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Token is expired or invalid.'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
