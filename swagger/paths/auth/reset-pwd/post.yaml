tags:
  - Auth
summary: Reset user password
operationId: resetPassword
description: >
  Verifies the JWT reset token received by email and updates the user's
  password. After a successful reset **all existing sessions** for that
  user are deleted (forcing a fresh login).
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            description: JWT token received in the reset-password email
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          password:
            type: string
            minLength: 6
            maxLength: 20
            description: The new password
            example: 'newSecurePassword123'
responses:
  '200':
    description: Password was successfully reset
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
            data:
              type: object
              example: {}
  '400':
    $ref: '../../../components/responses/errors.yaml#/400'
  '401':
    description: Unauthorized — token is expired or invalid
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Token is expired or invalid.'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
