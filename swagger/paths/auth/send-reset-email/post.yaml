tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: >
  Sends a password reset link to the provided email address.
  The link contains a JWT token valid for **5 minutes** and points to
  `APP_DOMAIN/reset-password?token=<jwt>`.
  Returns a 404 if no user with that email exists.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: 'john@example.com'
responses:
  '200':
    description: Reset email sent successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
            data:
              type: object
              example: {}
  '400':
    $ref: '../../../components/responses/errors.yaml#/400'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
  '500':
    $ref: '../../../components/responses/errors.yaml#/500'
