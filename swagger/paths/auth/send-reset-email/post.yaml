tags:
  - Auth
summary: send password reset link to email
operationId: sendResetEmail
description: >
  sends an email with a reset link to the user
  the link has a jwt token that expires in 5 minutes
  if the email doesnt exist in the db it returns 404
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: 'john@example.com'
responses:
  '200':
    description: email was sent
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
            data:
              type: object
              example: {}
  '400':
    $ref: '../../../components/responses/errors.yaml#/400'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
  '500':
    $ref: '../../../components/responses/errors.yaml#/500'
