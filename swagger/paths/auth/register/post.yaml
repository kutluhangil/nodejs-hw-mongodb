tags:
  - Auth
summary: create a new account
operationId: registerUser
description: >
  makes a new user account with name email and password
  returns the user info back but without the password
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/user.yaml#/RegisterInput'
responses:
  '201':
    description: account was created
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully registered a user!'
            data:
              $ref: '../../../components/schemas/user.yaml#/User'
  '400':
    $ref: '../../../components/responses/errors.yaml#/400'
  '409':
    description: this email is already used by someone else
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: 'Email in use'
