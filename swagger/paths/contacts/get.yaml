tags:
  - Contacts
summary: get all contacts
operationId: getContacts
description: >
  returns all contacts that belong to the logged in user
  you can filter by type or favourite and also sort and paginate the results
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: which page you want to see
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    description: how many contacts to show per page
  - in: query
    name: sortBy
    schema:
      type: string
      default: name
      example: name
    description: which field to sort by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: sort ascending or descending
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
    description: filter by contact type
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: show only favourites or non-favourites
responses:
  '200':
    description: got the contacts list back
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml#/Contact'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 25
                totalPages:
                  type: integer
                  example: 3
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/errors.yaml#/401'
