tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: >
  Returns a paginated list of contacts belonging to the authenticated user.
  Supports filtering by type and favourite status, and sorting by any field.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number for pagination
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    description: Number of contacts per page
  - in: query
    name: sortBy
    schema:
      type: string
      default: name
      example: name
    description: Field to sort by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort direction
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by type
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter by favourite status
responses:
  '200':
    description: Successfully retrieved contacts list
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml#/Contact'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 25
                totalPages:
                  type: integer
                  example: 3
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/errors.yaml#/401'
