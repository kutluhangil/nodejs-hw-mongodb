tags:
  - Contacts
summary: add a new contact
operationId: createContact
description: >
  creates a new contact for the logged in user
  you can also upload a photo and it gets saved to cloudinary
  the photo url is then stored in the contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            example: 'John Doe'
          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
            example: '+905551234567'
          email:
            type: string
            format: email
            example: 'john@example.com'
          contactType:
            type: string
            enum: [work, home, personal]
            example: personal
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
            description: optional photo for the contact max 5mb
responses:
  '201':
    description: contact was created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              $ref: '../../components/schemas/contact.yaml#/Contact'
  '400':
    $ref: '../../components/responses/errors.yaml#/400'
  '401':
    $ref: '../../components/responses/errors.yaml#/401'
