tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: >
  Returns a single contact document identified by its `contactId`.
  The contact must belong to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
    description: Unique MongoDB ObjectId of the contact
responses:
  '200':
    description: Successfully retrieved the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contact with id 65ca67e7ae7f10c88b598384!'
            data:
              $ref: '../../../components/schemas/contact.yaml#/Contact'
  '401':
    $ref: '../../../components/responses/errors.yaml#/401'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
