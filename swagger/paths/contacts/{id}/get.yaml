tags:
  - Contacts
summary: get one contact by id
operationId: getContactById
description: >
  returns a single contact by its id
  only works if the contact belongs to the logged in user
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
    description: the id of the contact you want to get
responses:
  '200':
    description: found the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contact with id 65ca67e7ae7f10c88b598384!'
            data:
              $ref: '../../../components/schemas/contact.yaml#/Contact'
  '401':
    $ref: '../../../components/responses/errors.yaml#/401'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
