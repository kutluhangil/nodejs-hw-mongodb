tags:
  - Contacts
summary: update a contact by id
operationId: updateContact
description: >
  updates some fields of an existing contact
  all fields are optional so you only send what you want to change
  if you include a photo it gets uploaded to cloudinary and the old one is replaced
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
    description: the id of the contact you want to update
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            example: 'Jane Doe'
          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
            example: '+905559876543'
          email:
            type: string
            format: email
            example: 'jane@example.com'
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          isFavourite:
            type: boolean
            example: true
          photo:
            type: string
            format: binary
            description: new photo to replace the old one max 5mb
responses:
  '200':
    description: contact was updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              $ref: '../../../components/schemas/contact.yaml#/Contact'
  '400':
    $ref: '../../../components/responses/errors.yaml#/400'
  '401':
    $ref: '../../../components/responses/errors.yaml#/401'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
