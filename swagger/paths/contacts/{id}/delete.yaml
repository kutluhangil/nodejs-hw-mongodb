tags:
  - Contacts
summary: delete a contact by id
operationId: deleteContact
description: >
  removes the contact from the database
  the contact has to belong to the logged in user
  returns nothing if it worked
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
    description: the id of the contact to delete
responses:
  '204':
    description: contact was deleted nothing returned
  '401':
    $ref: '../../../components/responses/errors.yaml#/401'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
