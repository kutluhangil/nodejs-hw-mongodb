tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContact
description: >
  Permanently deletes the contact identified by `contactId`.
  The contact must belong to the authenticated user.
  Returns HTTP 204 with no body on success.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
    description: Unique MongoDB ObjectId of the contact
responses:
  '204':
    description: Contact was successfully deleted (no content)
  '401':
    $ref: '../../../components/responses/errors.yaml#/401'
  '404':
    $ref: '../../../components/responses/errors.yaml#/404'
