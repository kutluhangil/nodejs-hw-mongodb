User:
  type: object
  properties:
    _id:
      type: string
      example: '65ca67e7ae7f10c88b598385'
    name:
      type: string
      example: 'John Doe'
    email:
      type: string
      format: email
      example: 'john@example.com'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

RegisterInput:
  type: object
  required:
    - name
    - email
    - password
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 20
      example: 'John Doe'
    email:
      type: string
      format: email
      example: 'john@example.com'
    password:
      type: string
      minLength: 3
      maxLength: 20
      example: 'password123'

LoginInput:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: 'john@example.com'
    password:
      type: string
      example: 'password123'
