Contact:
  type: object
  required:
    - name
    - phoneNumber
    - userId
  properties:
    _id:
      type: string
      example: '65ca67e7ae7f10c88b598384'
      description: Contact unique identifier (MongoDB ObjectId)
    name:
      type: string
      minLength: 3
      maxLength: 20
      example: 'John Doe'
    phoneNumber:
      type: string
      minLength: 3
      maxLength: 20
      example: '+905551234567'
    email:
      type: string
      format: email
      example: 'john@example.com'
    contactType:
      type: string
      enum:
        - work
        - home
        - personal
      default: personal
      example: personal
    isFavourite:
      type: boolean
      default: false
      example: false
    photo:
      type: string
      nullable: true
      example: 'https://res.cloudinary.com/demo/image/upload/v1/contacts/abc123.jpg'
      description: Cloudinary URL of the contact photo
    userId:
      type: string
      example: '65ca67e7ae7f10c88b598385'
      description: Owner user ID
    createdAt:
      type: string
      format: date-time
      example: '2025-01-01T00:00:00.000Z'
    updatedAt:
      type: string
      format: date-time
      example: '2025-01-02T00:00:00.000Z'

ContactInput:
  type: object
  required:
    - name
    - phoneNumber
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 20
      example: 'John Doe'
    phoneNumber:
      type: string
      minLength: 3
      maxLength: 20
      example: '+905551234567'
    email:
      type: string
      format: email
      example: 'john@example.com'
    contactType:
      type: string
      enum:
        - work
        - home
        - personal
      example: personal
    isFavourite:
      type: boolean
      example: false
    photo:
      type: string
      format: binary
      description: Contact photo file (image upload)

ContactUpdateInput:
  type: object
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 20
      example: 'Jane Doe'
    phoneNumber:
      type: string
      minLength: 3
      maxLength: 20
      example: '+905559876543'
    email:
      type: string
      format: email
      example: 'jane@example.com'
    contactType:
      type: string
      enum:
        - work
        - home
        - personal
      example: work
    isFavourite:
      type: boolean
      example: true
    photo:
      type: string
      format: binary
      description: New contact photo file (image upload)
