400:
  description: Bad Request — validation error
  content:
    application/json:
      schema:
        type: object
        required:
          - status
          - message
        properties:
          status:
            type: integer
            example: 400
          message:
            type: string
            example: '"name" is required'

401:
  description: Unauthorized — missing or invalid token
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 401
          message:
            type: string
            example: 'Access token expired'
          data:
            type: string

404:
  description: Not Found
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 404
          message:
            type: string
            example: 'Contact not found'
          data:
            type: string

500:
  description: Internal Server Error
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 500
          message:
            type: string
            example: 'Something went wrong'
          data:
            type: string
