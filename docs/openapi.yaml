openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    a simple api for managing contacts
    you can register log in and then create update or delete your contacts
    also supports photo upload to cloudinary and password reset via email

tags:
  - name: Auth
    description: all the login register logout and password reset stuff
  - name: Contacts
    description: create read update and delete contacts with optional photo

servers:
  - url: http://localhost:3000
    description: run it locally
  - url: https://nodejs-hw-mongodb.onrender.com
    description: the deployed version on render

paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'

  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'

  /auth/register:
    post:
      $ref: '../swagger/paths/auth/register/post.yaml'

  /auth/login:
    post:
      $ref: '../swagger/paths/auth/login/post.yaml'

  /auth/send-reset-email:
    post:
      $ref: '../swagger/paths/auth/send-reset-email/post.yaml'

  /auth/reset-pwd:
    post:
      $ref: '../swagger/paths/auth/reset-pwd/post.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        paste the access token you got from login here
        format is bearer then a space then the token

  schemas:
    Contact:
      $ref: '../swagger/components/schemas/contact.yaml#/Contact'
    ContactInput:
      $ref: '../swagger/components/schemas/contact.yaml#/ContactInput'
    ContactUpdateInput:
      $ref: '../swagger/components/schemas/contact.yaml#/ContactUpdateInput'
    User:
      $ref: '../swagger/components/schemas/user.yaml#/User'
    RegisterInput:
      $ref: '../swagger/components/schemas/user.yaml#/RegisterInput'
    LoginInput:
      $ref: '../swagger/components/schemas/user.yaml#/LoginInput'

  responses:
    400:
      $ref: '../swagger/components/responses/errors.yaml#/400'
    401:
      $ref: '../swagger/components/responses/errors.yaml#/401'
    404:
      $ref: '../swagger/components/responses/errors.yaml#/404'
    500:
      $ref: '../swagger/components/responses/errors.yaml#/500'

